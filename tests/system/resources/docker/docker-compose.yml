services:
  openvpn:
    build:
      context: ../../../../
      dockerfile: "tests/system/resources/docker/openvpn/Dockerfile"
      args:
        python_version: "${python_version}"
        openvpn_version: "${openvpn_version}"
    tty: true
    cap_add:
      - NET_ADMIN
    environment:
      - TEST_PYTHON_VERSION=${python_version}
      - TEST_OPENVPN_VERSION=${openvpn_version}
      - TEST_LDAP_URL=ldap://openldap:1389
      - TEST_LDAP_BASE_DN=dc=example,dc=org
      - TEST_LDAP_ADMIN_DN=cn=admin,dc=example,dc=org
      - TEST_LDAP_ADMIN_PASSWORD=adminpassword
      - TEST_OPENVPN_BINARY=/usr/sbin/openvpn
    volumes:
      - ../../../../:/project
    depends_on:
      - openldap
  openldap:
    # ponytail: frozen image (Bitnami moved its free catalog to bitnamilegacy in 2025); fine for tests
    image: docker.io/bitnamilegacy/openldap:2.6.10-debian-12-r4
    environment:
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=adminpassword
