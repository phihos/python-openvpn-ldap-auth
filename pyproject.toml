[project]
name = "openvpn-ldap-auth"
version = "0.2.0"
description = "An auth verify script for OpenVPN to authenticate via LDAP."
authors = [{ name = "Philipp Hossner", email = "philipph@posteo.de" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["OpenVPN", "LDAP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
dependencies = [
    "PyYAML>=6.0.1",
    "python-ldap>=3.4",
    # transitive via python-ldap; floor pins the security fix
    "pyasn1>=0.6.3",
]

[project.urls]
Homepage = "https://github.com/phihos/python-openvpn-ldap-auth/"
Repository = "https://github.com/phihos/python-openvpn-ldap-auth/"
Issues = "https://github.com/phihos/python-openvpn-ldap-auth/issues"

[project.scripts]
openvpn-ldap-auth = "openvpn_ldap_auth.main:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pexpect>=4.9",
    "pyinstaller>=6.16",
    "pytest>=8.4",
    "pytest-timeout>=2.4",
    "ruff>=0.14",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["openvpn_ldap_auth", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
# bare assert is how pytest asserts
"tests/unit/*" = ["S101"]

[tool.mypy]
strict = true
files = ["openvpn_ldap_auth"]

[[tool.mypy.overrides]]
module = ["ldap", "ldap.*"]
ignore_missing_imports = true
